# Local stack: our app + our own Postgres (pgvector) + a Prefect server, plus
# Immich's own stack pulled in from docker-compose.immich.yml. Our Postgres is
# a separate service/database from Immich's — our alembic migrations must
# never touch Immich's schema.
name: photobook-transformer

services:
  app:
    build: .
    env_file:
      - .env
    environment:
      # Overrides the host-side DATABASE_URL from .env (localhost) with the
      # in-network one (db) — any other service added here that talks to our
      # Postgres needs the same override, since env_file alone would give it
      # the host-side value.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-album}:${APP_DB_PASSWORD:-album}@db:5432/${APP_DB_NAME:-album}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/albums:/app/data/albums

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${APP_DB_USER:-album}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-album}
      POSTGRES_DB: ${APP_DB_NAME:-album}
    ports:
      - '${APP_DB_HOST_PORT:-5432}:5432'
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${APP_DB_USER:-album}']
      interval: 5s
      timeout: 5s
      retries: 10

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - '4200:4200'
    volumes:
      - prefect-data:/root/.prefect

include:
  - docker-compose.immich.yml

volumes:
  app-db-data:
  prefect-data:

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types: [python]
        pass_filenames: false
      - id: xenon
        name: xenon (complexity gate)
        # Fast, import-free static metric check, so it belongs with the per-commit
        # static gates (ruff/basedpyright) rather than the pre-push/`poe check`
        # tier where pytest lives. Same thresholds as the `check` poe task.
        entry: uv run xenon --max-absolute B --max-modules B --max-average A src
        language: system
        types: [python]
        pass_filenames: false

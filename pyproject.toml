[project]
name = "album"
version = "0.1.0"
description = "Batch pipeline that turns a raw photo dump into a curated, enhanced, captioned, print-ready photo book."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.1",
    "opencv-python-headless>=5.0.0.93",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "prefect>=3.7.8",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-ai-slim[anthropic]>=2.9.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "tzdata>=2026.3",
    "weasyprint>=69.0",
]

[project.optional-dependencies]
# Opt-in heavy ML stack for the real LAION/open_clip aesthetic scorer + CLIP
# embedder (build step 31). Kept OUT of base `dependencies` on purpose: torch
# alone is ~1.7 GB resident + ~1.5–2 GB install, so `pip install album` (and the
# default offline pipeline, which uses the NULL-scoring placeholder) stays lean.
# Install with `uv sync --extra scoring` (dev/CI) or `pip install album[scoring]`.
#
# torch>=2.13.0 is a HARD floor, not style: 2.13.0 (2026-07-08) is the first torch
# release shipping a cp314 wheel, and this repo is `requires-python >=3.14`, so
# anything lower has no installable wheel. Apple Silicon resolves the native arm64
# wheel (MPS-capable); Linux/CI resolves the CPU wheel. open-clip-torch>=3.3.0
# (latest stable, MIT) pins no torch minimum, so torch's floor governs. `>=` matches
# every base dep's idiom; uv.lock pins the exact resolved build. Do NOT move to base.
scoring = [
    "torch>=2.13.0",
    "open-clip-torch>=3.3.0",
]

[project.scripts]
photobook-generator = "album.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "radon>=6.0.1",
    "respx>=0.23.1",
    "ruff>=0.15.21",
    "testcontainers[postgres]>=4.14.2",
    "types-pyyaml>=6.0.12.20260518",
    "xenon>=0.9.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]
# COM812 (trailing commas) is deliberately NOT enforced by the linter: ruff
# advises it "may conflict with the formatter" and prints that advisory on every
# format run. We applied the one-time COM812 reformat, and the formatter's magic
# trailing comma (on by default) keeps existing trailing commas expanded
# one-per-line and adds them when it wraps long lines — so collections stay
# vertical without the linter rule. Listed in ignore (not merely dropped from
# select) to document the decision and keep the advisory silent if a broader
# select ever re-includes it.
ignore = ["COM812"]

[tool.ruff.lint.mccabe]
# Cheap, dependency-free complexity smell check (Sonar-style), complementing the
# radon/xenon gate below. Ceiling 5 matches the radon A boundary (CC <= 5), so an
# over-complex function trips this fast ruff pass before the harder xenon gate.
# mccabe scores a touch more leniently than radon CC, so xenon still holds the
# harder per-block/module/average line — this just catches regressions early.
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
# The A-level complexity gate governs *production* code — xenon runs on `src`
# only, and mccabe (C901) mirrors that scope. Test functions are governed by the
# §2 testing conventions (class grouping, parametrization) rather than a per-
# function CC ceiling: an orchestration/wiring test (e.g. flow's task-graph
# assertions) is legitimately branchier than any single production method, and
# splitting it to hit CC 5 would harm rather than help readability.
"tests/**" = ["C901"]

[tool.basedpyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# `integration` marks tests that exercise a real boundary rather than pure logic
# with in-memory SQLite + doubles: a real container (Postgres/pgvector,
# darktable-cli) OR the real HTTP client driven through its transport layer
# (respx-mocked Immich/Lulu clients). They still run in the default gate
# (`poe check`/`poe test`) since Docker is available; `poe test-unit`
# (-m "not integration") skips them for a quick pure-logic local loop, and
# `poe test-integration` runs only them.
markers = [
    "integration: exercises a real boundary — a service container (Postgres/pgvector, darktable-cli) or the real HTTP client via respx — not pure logic",
]

[tool.poe]
# So `uv run poe migrate`/`makemigration` pick up DATABASE_URL (and any other
# .env vars) when run standalone, outside docker compose (which sources .env
# itself via env_file:). Missing .env (e.g. a fresh checkout) is a no-op, not
# an error.
envfile = ".env"

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
typecheck = "basedpyright"
test = "pytest"
# Quick local loop: pure-logic tests only, skipping the integration-marked ones.
test-unit = "pytest -m 'not integration'"
# Only the integration-marked tests (containers + real HTTP client boundary).
test-integration = "pytest -m 'integration'"
# Complexity/maintainability gate (radon metrics, enforced by xenon). Thresholds
# are A across the board: no single block worse than A (CC>5), no module averaging
# worse than A, whole-codebase average A. Radon grades a class by the mean of its
# methods and a module by the mean of its blocks, so keeping every method CC <= 5
# satisfies all three. Tightened to A after the Stage Template Method base removed
# the per-stage album-guard branch and the remaining grade-B methods were split.
complexity = "xenon --max-absolute A --max-modules A --max-average A src"
up = "docker compose up --build"
down = "docker compose down"
migrate = "alembic upgrade head"
makemigration = "alembic revision --autogenerate"
build = "photobook-generator build"
# One-time, internet-touching setup for the offline Immich ML test: bake the ML
# model image + pre-pull the other stack images. Delegates to the test harness so
# the command + version pin live in exactly one place.
bake-immich-ml = "python -c \"import sys; from tests.album.immich.immich_ml_stack import prepare_offline_stack; sys.exit(prepare_offline_stack(capture=False).returncode)\""
# One-time, internet-touching setup for the real aesthetic scorer (build step 31):
# download the ViT-L/14 open_clip weights + the LAION aesthetic head into
# `quality.weights_dir`, pinned, so a real `quality` run is fully offline afterward
# (mirrors `bake-immich-ml`). Needs the `scoring` extra installed. Provenance +
# licenses are recorded in `fetch_weights`'s docstring.
fetch-aesthetic-weights = "python -c \"from album.analysis.aesthetic import fetch_weights; fetch_weights()\""

[tool.poe.tasks.test-immich-ml]
# Opt-in Immich ML integration test (playbook step 24) — real stack, offline
# models. Heavy, so it is NOT in `poe check`; the test fixture runs the one-time
# setup on first run if `bake-immich-ml` hasn't been run yet.
cmd = "pytest tests/album/immich/test_immich_ml_integration.py"
env = { IMMICH_ML_INTEGRATION = "1" }

[tool.poe.tasks.test-scoring]
# Opt-in real-scorer test (build step 31) — needs the `scoring` extra installed AND
# the weights fetched (`poe fetch-aesthetic-weights`). Heavy (imports torch, loads
# ViT-L/14), so it is NOT in `poe check`; the real-model tests are `skipif`-gated on
# `find_spec` (torch/open_clip) + weights present + `SCORING_INTEGRATION=1`, so they're
# a no-op in the default gate (the torch-free helper tests still run there).
cmd = "pytest tests/album/analysis/test_aesthetic.py"
env = { SCORING_INTEGRATION = "1" }

[tool.poe.tasks.metrics]
# Non-gating human report: cyclomatic complexity (with average) + maintainability
# index per module. `poe complexity` is the gate; this is for eyeballing where the
# hotspots are.
sequence = [
    { cmd = "radon cc src -s -a" },
    { cmd = "radon mi src -s" },
]

[tool.poe.tasks.check]
# pytest exits 5 when it collects zero tests; that's an expected state before
# the first test file lands, so tolerate it here without masking real failures.
sequence = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
    { cmd = "basedpyright" },
    { cmd = "xenon --max-absolute A --max-modules A --max-average A src" },
    { shell = "pytest || [ \"$?\" = \"5\" ]" },
]

[package]
name = "rust-client-viewer"
version = "0.1.0"
edition = "2021"
description = "GPU photo viewer (wgpu) compiled to WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# wgpu >= 23: drops the `maxInterStageShaderComponents` limit that current Chrome
# removed from the WebGPU spec (22 sends it → requestDevice rejects).
# `webgl` feature: enables the GL backend so the same viewer falls back to WebGL2
# when WebGPU is unavailable (one Rust codebase, two GPU backends).
wgpu = { version = "23", features = ["webgl"] }
bytemuck = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement"]

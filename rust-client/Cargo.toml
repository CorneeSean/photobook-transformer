# Cargo workspace for the WASM crates. Shared target/ + lockfile; each crate is
# built independently with `wasm-pack build --target web` (see rust-client/README.md).
# (The `core` vector-store crate was retired — sqlite-vec now owns storage + KNN.)
[workspace]
members = ["viewer", "rawpdf"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true

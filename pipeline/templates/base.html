<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{ album_title }}</title>
<style>
  @page {
    size: {{ page_width_in }}in {{ page_height_in }}in;
    margin: 0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    width: {{ page_width_in }}in;
    height: {{ page_height_in }}in;
  }
  .page {
    position: relative;
    width: {{ page_width_in }}in;
    height: {{ page_height_in }}in;
    page-break-after: always;
    overflow: hidden;
  }
  .page:last-child { page-break-after: avoid; }
  /* Bleed is the outer {{ bleed_in }}in on every edge; content stays within the
     trim box, and the further safety_margin_in inset keeps photos/captions off
     the trim edge to survive real-world cutting tolerance. */
  .safe-area {
    position: absolute;
    top: {{ bleed_in + safety_margin_in }}in;
    left: {{ bleed_in + safety_margin_in }}in;
    right: {{ bleed_in + safety_margin_in }}in;
    bottom: {{ bleed_in + safety_margin_in }}in;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    width: 100%;
    height: 100%;
    gap: 0.15in;
  }
  .grid img {
    object-fit: cover;
    display: block;
  }
  .grid-1up .cell { width: 100%; height: 100%; }
  .grid-2up .cell { width: 100%; height: calc(50% - 0.075in); }
  .grid-3up .cell { width: 100%; height: calc(33.333% - 0.1in); }
  .cell img { width: 100%; height: 100%; }
  .caption {
    font-size: 8pt;
    color: #333;
    margin-top: 0.05in;
  }
  .section-title {
    font-size: 28pt;
    font-weight: bold;
  }
  .section-place {
    font-size: 14pt;
    color: #666;
    margin-top: 0.1in;
  }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>

# Immich stack for the OFFLINE ML integration test (TestContainers playbook
# step 24). Mirrors docker-compose.immich.yml but, for a throwaway test stack:
#   - pins a concrete IMMICH_VERSION (the vendored compose tracks moving :release);
#   - runs the PRE-BAKED ML image (see ml-baked.Dockerfile) with the models
#     already on disk, forced offline (HF_HUB_OFFLINE) — no download at test time;
#   - keeps ALL state ephemeral (no host mounts; `down -v` wipes it) and binds to
#     an EPHEMERAL host port so parallel/repeat runs don't collide;
#   - disables reverse-geocoding (a second startup internet hit; out of scope for
#     the faces+CLIP test — see immich-api.md step-20 geocoding note).
name: immich-ml-it

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.0.3}
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_REVERSE_GEOCODING_ENABLED: "false"
    ports:
      - "2283" # ephemeral host port; the test resolves it via `compose port`
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false # use the image's built-in immich-healthcheck

  immich-machine-learning:
    # Built by `uv run poe bake-immich-ml` from ml-baked.Dockerfile. Not pulled —
    # if it's missing the test fails with a clear "run poe bake-immich-ml" hint.
    image: immich-ml-baked:${IMMICH_VERSION:-v3.0.3}
    environment:
      MACHINE_LEARNING_MODEL_TTL: "0" # keep models resident — no reload churn mid-test
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    healthcheck:
      disable: false # use the image's built-in healthcheck

  redis:
    # Digest-pinned to match the vendored docker-compose.immich.yml — hermetic.
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    shm_size: 128mb
    healthcheck:
      test: pg_isready -U postgres -d immich || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
